# ============================================================================
# postgresql.tuning.conf - planner cost model correction for postgres-archives
# ============================================================================
#
# NOT APPLIED. This file is a record of a measured change plus the exact
# commands to apply it deliberately. Nothing here has been written to the
# running server and nothing has been restarted.
#
# Target: container `postgres-archives` (image postgres:18, actually 18.1) on
#         the database host, whose compose stack lives outside this repo.
#         (Measured against that deployment, not against a local development
#         copy - they are different stacks.)
#
# ---------------------------------------------------------------------------
# WHAT WAS MEASURED ON THE BOX (2026-09-16) - not assumed, not copied from a
# tuning guide. Commands are quoted so they can be re-run.
# ---------------------------------------------------------------------------
#
#   $ free -m  /  /proc/meminfo
#       MemTotal      16,110,048 kB   = 15.36 GiB   <-- NOT a big-memory box
#       MemAvailable   9,407,648 kB   =  8.97 GiB
#       Cached        12,745,020 kB   = 12.15 GiB  (includes Shmem)
#       Shmem          4,312,276 kB   =  4.11 GiB  (= shared_buffers, 4GB)
#       => real OS page cache        ~= 12.15 - 4.11 = 8.04 GiB
#       Swap 16.9 GiB total, 3.44 GiB USED  <-- box has been oversubscribed
#       nproc = 4
#
#   $ ps -eo rss,comm | grep -v postgres | sum
#       3,630 MB = 3.55 GiB resident in non-Postgres processes
#       (KDE/plasmashell, firefox, the bun webserver/parser containers, pgadmin)
#
#   $ lsblk -d -o NAME,ROTA,SIZE,MODEL
#       nvme0n1   ROTA=0   476.9G   "HighRel 512GB SSD"     <-- NON-ROTATIONAL
#
#   $ findmnt --target <compose-dir>/database/data/
#       /dev/nvme0n1p2[/@home]  btrfs  /home
#       The data directory is a bind mount of
#         <compose-dir>/database/data/ -> /var/lib/postgresql
#       so PGDATA (/var/lib/postgresql/18/docker) is on nvme0n1p2. NVMe, btrfs.
#       Confirmed non-rotational - random_page_cost=4 is a spinning-disk number
#       and is simply wrong for this device.
#
#   $ cat /proc/pressure/memory
#       some avg10=0.00 avg60=0.00 avg300=0.00   <-- no pressure RIGHT NOW,
#       but cumulative total=290s and 3.44 GiB sitting in swap say it has been
#       under pressure before. This is why shared_buffers is left alone (below).
#
#   Database size: 56 GB total (records 22GB, responses 17GB, uris 12GB,
#   payloads 4.5GB) against 15.36 GiB of RAM. The working set is ~3.6x RAM and
#   CANNOT be cached. No amount of memory tuning changes that.
#
# ---------------------------------------------------------------------------
# CORRECTION TO THE BRIEF
# ---------------------------------------------------------------------------
# The brief said effective_cache_size had been "set EQUAL to shared_buffers -
# this is the bug". pg_settings says otherwise:
#
#   name                  setting   source               context
#   effective_cache_size  524288    default              user
#   random_page_cost      4         default              user
#   work_mem              4096      default              user
#   shared_buffers        524288    configuration file   postmaster
#                                   (postgresql.auto.conf:3, i.e. ALTER SYSTEM)
#
# effective_cache_size was never set by anyone - 4GB is the stock PostgreSQL
# default. It equals shared_buffers by coincidence, because someone set
# shared_buffers to exactly the default effective_cache_size. The effect is the
# same (the planner believes only 4GB of cache exists), but the cause is "this
# server has never been tuned past shared_buffers", not a bad deliberate choice.
# Everything except shared_buffers and a handful of locale/WAL entries is stock.
#
# ============================================================================
# THE CHANGE
# ============================================================================

# ----------------------------------------------------------------------------
# effective_cache_size = 10GB          (was: 4GB, stock default)
# RELOAD ONLY - context=user, no restart. Allocates NO memory; it is purely a
# number the planner does arithmetic with.
# ----------------------------------------------------------------------------
# Derivation from the measurements above, not a rule of thumb:
#     15.36 GiB  total RAM
#    -  3.55 GiB  measured non-Postgres resident set
#    -  ~1.0 GiB  kernel/slab/headroom
#    = 10.8  GiB  available to shared_buffers + Postgres page cache
#   -> round DOWN to 10GB.
# Observed right now is 4.11 (shmem) + 8.04 (page cache) = 12.15 GiB, so 10GB
# is deliberately conservative: the box swaps, and firefox/the parser can grow.
# The 0.75 x RAM rule would say 11.5GB; 10GB leaves room for being wrong.
effective_cache_size = 10GB

# ----------------------------------------------------------------------------
# random_page_cost = 1.1               (was: 4, stock default)
# RELOAD ONLY - context=user, no restart.
# ----------------------------------------------------------------------------
# 4.0 encodes "a random page costs 4x a sequential page", which describes a
# 7200rpm disk. PGDATA is on nvme0n1 with ROTA=0 (measured). 1.1 rather than
# 1.0 because the filesystem is btrfs: copy-on-write fragments files that are
# rewritten in place, and ingest UPDATEs uris.content_type_ids constantly, so
# "random" here is slightly worse than raw NVMe random read.
random_page_cost = 1.1

# ============================================================================
# WHAT THIS DOES TO THE kiwifarms.net QUERY - MEASURED, AND HONEST
# ============================================================================
#
# The query shape (search_responses CASE 1, the inner CTE that actually costs):
#
#     SELECT u.id, u.uri, u.recursion_level FROM uris u
#     WHERE u.uri ILIKE '%kiwifarms.net%'
#     ORDER BY u.recursion_level ASC, u.uri ASC
#     LIMIT 64 OFFSET <n>
#
# Run under EXPLAIN (ANALYZE, BUFFERS) at four settings combinations:
#
#   setting combo        off   plan                        buffers(hit)  rows removed   exec
#   ecs=4GB   rpc=4.0    320   Index Scan idx_uris_rl_uri     945,445      1,181,128   1886ms
#   ecs=11GB  rpc=4.0    320   Index Scan idx_uris_rl_uri     945,445      1,181,128   1696ms
#   ecs=4GB   rpc=1.1    320   Index Scan idx_uris_rl_uri     945,445      1,181,128   1736ms
#   ecs=11GB  rpc=1.1    320   Index Scan idx_uris_rl_uri     945,445      1,181,128   1741ms
#
#   ecs=4GB   rpc=4.0   1600   Index Scan idx_uris_rl_uri     947,378      1,181,128   1737ms
#   ecs=11GB  rpc=1.1   1600   Index Scan idx_uris_rl_uri     947,378      1,181,128   1760ms
#
# >>> THIS CHANGE DOES NOT MAKE THE QUERY FASTER. <<<
#
# Same plan, byte-identical buffer counts, identical "Rows Removed by Filter".
# The work done is literally the same; the 1696-1886ms spread is run-to-run
# noise (~2% at offset 1600, where the cache is fully warm and the numbers are
# 1737 vs 1760). Anyone who reports this change as a latency win has measured
# noise.
#
# That is expected and was predictable: the cost is a fixed prefix walk of
# ~1.18M non-matching index entries that must be skipped before the ordered
# page can be produced. effective_cache_size and random_page_cost change what
# the planner ESTIMATES, never what the executor DOES. The 945k buffers are all
# `hit`, read=0 - nothing is waiting on the NVMe, so making the planner believe
# the NVMe is fast cannot return time that was never spent on I/O.
#
# The real fix for the timeout is the one in flight in backend/db.ts: the 300ms
# statement_timeout tripwire cancels a 2.5s query and substitutes a 19s one.
# This file does not address that and is not a substitute for it.
#
# ---------------------------------------------------------------------------
# SO WHY MAKE THE CHANGE AT ALL? Because of what it does to the MARGIN.
# ---------------------------------------------------------------------------
# What actually moves is the estimated cost of the chosen plan, and therefore
# how far the good plan sits from the bad one. Measured with EXPLAIN (COSTS),
# forcing the alternative with enable_indexscan=off:
#
#   settings            off    chosen plan cost   best alternative   margin
#   rpc=4.0 ecs=4GB     320        2,087.37          534,843            256x
#   rpc=1.1 ecs=10GB    320          114.71          534,843          4,662x
#   rpc=4.0 ecs=4GB    1600        9,042.99          551,140             61x
#   rpc=1.1 ecs=10GB   1600          494.78          551,140          1,114x
#
# (The alternative is a Parallel Seq Scan + Sort. Its cost does not move,
# because seq_page_cost stays 1.0 and effective_cache_size does not enter a
# sequential scan's cost. Notably the trigram index idx_uris_trgm is not even
# the runner-up - at an estimated 3.66M matching rows, ~22% of the table, a
# bitmap over it loses to the seq scan.)
#
# The safety question that gated this change was the opposite one: could
# lowering random_page_cost make an index-driven path look cheap enough to flip
# CASE 1 onto the trigram shape - the ~19s search_responses_broad behaviour?
# Measured answer: NO. Lowering rpc cheapens the ordered index scan far faster
# than any alternative, so the margin WIDENS by ~18x. The good plan becomes
# harder to dislodge, not easier. That is the entire benefit: insurance against
# a plan flip as the corpus grows and row estimates drift, not a speedup.
#
# Second-order benefit, not measured here: every other query in the app is
# currently costed as if this were a spinning disk. Correcting rpc biases the
# whole workload toward index access on hardware that actually rewards it.
#
# ============================================================================
# DELIBERATELY NOT CHANGED
# ============================================================================
#
# shared_buffers - LEAVE AT 4GB. REQUIRES A RESTART, which drops every
#   connection and interrupts the live site, so it is treated separately on
#   purpose. Measurement says do not do it anyway:
#     - 4GB of 15.36 GiB is 26%, already at the conventional 25% ceiling.
#     - The working set is 56 GB, 3.6x RAM. There is no value of
#       shared_buffers on this box that caches it. Raising it only moves pages
#       from OS page cache (which also serves the bun containers) into
#       Postgres' own cache, on a machine with 3.44 GiB already in swap.
#     - The measured buffer cache hit ratio is already 95.74%, and the
#       kiwifarms query reads 0 blocks from disk.
#   If shared_buffers is ever revisited, it is a separate, scheduled change
#   with a restart window - not part of this fix.
#
# work_mem - LEAVE AT 4MB. Honest assessment: it would not help. The chosen
#   plan has no Sort, Hash or Materialize node that spills; it is an ordered
#   index walk feeding a Limit. work_mem only ever mattered to the
#   search_responses_broad strategy, whose fenced materialize-then-sort shape
#   needs a large sort - and that strategy is being deleted. Raising work_mem
#   on a 4-core, 15 GiB box with max_connections=100 is also how you get an
#   OOM, since it is per-sort-node, not per-query.
#
# effective_io_concurrency - LEAVE AT 16. It is the PostgreSQL 18 default
#   (boot_val=16), not a previous operator's choice. Raising it toward 200 is
#   defensible for NVMe, but it only affects prefetch for bitmap heap scans and
#   this query performs none - it would be an unmeasurable change to the
#   problem at hand. If it is raised, raise it for the ingest path, with its
#   own measurement.
#
# jit - LEAVE ON. Not implicated. jit_above_cost is 500,000 and the top-level
#   plan cost is 2,087 today and 115 after this change, so JIT never triggers
#   for this query. Measured planning time is 1.1-2.6ms.
#
# plan_cache_mode - LEAVE AT auto. Already refuted by prior measurement
#   (auto picks a custom plan; force_generic_plan is 3-5x worse).
#
# ============================================================================
# HOW TO APPLY - RELOAD ONLY, NO RESTART, NO DOWNTIME
# ============================================================================
#
# Both settings have context=user in pg_settings, so a SIGHUP reload is enough
# and they take effect in already-open backends at the next statement. Neither
# needs a restart. shared_buffers (context=postmaster) is the only setting
# discussed here that would, and it is not being changed.
#
# The config file lives inside the container's PGDATA
# (/var/lib/postgresql/18/docker/postgresql.conf), which on the host is
# root-owned under .../database/data/18/docker and NOT writable over ssh:
# `sudo -n` on that host fails without an interactive password, and the docker
# socket rejects the unprivileged account outright. So editing the file in
# place is not available non-interactively.
#
# Use ALTER SYSTEM instead. It writes postgresql.auto.conf - the same file
# shared_buffers is already set in - and needs no filesystem or docker access.
# It does require a superuser role. Run it over the direct connection, the
# same way these measurements were taken:
#
#     psql "$DATABASE_URL"          # must connect as a superuser role
#
#     ALTER SYSTEM SET effective_cache_size = '10GB';
#     ALTER SYSTEM SET random_page_cost = 1.1;
#     SELECT pg_reload_conf();
#
# Confirm it landed (source must read 'configuration file', NOT 'default'):
#
#     SELECT name, setting, unit, source, context, pending_restart
#     FROM pg_settings
#     WHERE name IN ('effective_cache_size','random_page_cost');
#
#   Expect: effective_cache_size | 1310720 | 8kB | configuration file | user | f
#           random_page_cost     | 1.1     |     | configuration file | user | f
#   pending_restart = false on both is the proof that no restart is owed.
#
# ONE OPERATIONAL CATCH: search_responses is plpgsql, so its plans are cached
# per backend. A GUC cost change does NOT invalidate an already-cached plan, so
# pooled connections in the bun webserver will keep planning the old way until
# they are recycled. After the reload, either run DISCARD PLANS on each pooled
# connection or bounce the webserver-archives container's pool. Until that
# happens, a before/after comparison will show no change at all - and will be
# measuring stale plans, not the new settings.
#
# TO ROLL BACK (also reload-only):
#
#     ALTER SYSTEM RESET effective_cache_size;
#     ALTER SYSTEM RESET random_page_cost;
#     SELECT pg_reload_conf();
#
# ============================================================================
# HOW TO VERIFY THE EFFECT AFTERWARDS
# ============================================================================
#
# Do NOT verify by timing the search and looking for a speedup. There is no
# speedup, and timing noise on this query is +/-200ms. Verify the two things
# that actually changed:
#
# 1. The cost estimate fell, and the plan did not change.
#
#      EXPLAIN (ANALYZE, BUFFERS)
#      SELECT u.id, u.uri, u.recursion_level FROM uris u
#      WHERE u.uri ILIKE '%kiwifarms.net%'
#      ORDER BY u.recursion_level ASC, u.uri ASC
#      LIMIT 64 OFFSET 320;
#
#    PASS = node is still "Index Scan using idx_uris_recursion_level_uri",
#           "Buffers: shared hit=945445" (read=0),
#           "Rows Removed by Filter: 1181128",
#           and the Limit's total cost has dropped ~2087 -> ~115.
#    FAIL = the node changed to a Seq Scan, a Sort appeared, or the buffer
#           count moved. Any of those means roll back immediately.
#
# 2. The margin over the alternative widened (this is the actual deliverable):
#
#      BEGIN;
#        SET LOCAL enable_indexscan = off;
#        EXPLAIN (COSTS) <same query>;   -- expect ~534,843, unchanged
#      ROLLBACK;
#
#    Compare against the chosen plan's ~115. Margin should read ~4,600x rather
#    than the ~256x it is today.
#
# 3. Confirm nothing regressed corpus-wide. Before the reload, capture:
#
#      SELECT relname, seq_scan, idx_scan FROM pg_stat_user_tables
#      WHERE relname IN ('uris','records','responses','payloads');
#
#    Re-read after 24h of normal traffic. seq_scan on these tables should be
#    flat or lower. A rising seq_scan count after lowering random_page_cost
#    would be the opposite of the intent and is the signal to roll back.
#    (Baseline at time of writing: idx_uris_trgm 14,834 scans,
#    idx_uris_recursion_level_uri 2,417 scans, uris_uri_key 64,460,089.)
#
# 4. Sanity-check the memory assumption still holds, since effective_cache_size
#    is a claim about the machine, not about Postgres:
#
#      free -m    # Cached minus Shmem should remain >= ~6 GiB
#
#    If the box grows another memory consumer and real page cache falls well
#    below 6 GiB, lower effective_cache_size to match rather than leaving the
#    planner over-optimistic.
#
# ============================================================================
